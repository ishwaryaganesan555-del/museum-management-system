<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Tamil Nadu Museums</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🏛️</text></svg>" />
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #e8e8e8, #d3d3d3);
            text-align: center;
            color: #6b4fa3;
        }

        header {
            background: #d0c5d9;
            color: #6b4fa3;
            padding: 15px;
            font-size: 22px;
            position: relative;
            box-shadow: 0 4px 6px rgba(186, 85, 211, 0.3);
            border-bottom: 2px solid #ba55d3;
        }

        .top {
            margin: 15px;
        }

        input, select {
            padding: 8px;
            width: 220px;
            margin: 5px;
            border-radius: 6px;
            border: 2px solid #ba55d3;
            background-color: #f5f0f8;
            color: #6b4fa3;
        }

        input::placeholder {
            color: #9370db;
        }

        #museums {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: #f5f0f8;
            color: #6b4fa3;
            width: 260px;
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(186, 85, 211, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #ba55d3;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(186, 85, 211, 0.5);
            background: #e8dff5;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ba55d3;
        }

        button {
            margin: 4px;
            padding: 7px 12px;
            border: none;
            background: #ba55d3;
            color: #555555;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }

        button:hover {
            background: #9370db;
            color: #f5f0f8;
        }

        .back {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 14px;
            background: #ba55d3;
            color: #555555;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .back:hover {
            background: #9370db;
            color: #f5f0f8;
        }
        
        /* 📱 Mobile responsive design */
        @media (max-width: 768px) {
            header { font-size: 18px; padding: 12px; }
            input, select { width: calc(100% - 20px); padding: 8px; font-size: 13px; }
            .gallery { grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px; }
            .card { width: 100%; }
            .card img { height: 120px; }
            button { padding: 8px 12px; font-size: 12px; }
            .back { display: none !important; }
        }
        
        @media (max-width: 480px) {
            header { font-size: 16px; padding: 8px; }
            input, select { width: calc(100% - 16px); padding: 6px; font-size: 13px; }
            .gallery { grid-template-columns: 1fr; gap: 6px; margin: 6px; }
            .card { width: 100%; margin: 4px 0; padding: 8px; }
            .card img { height: 100px; }
            button { padding: 6px 10px; font-size: 11px; }
        }
    </style>
</head>

        // ====== Populate District Dropdown ======
        const districtSelect = document.getElementById("district");
        [...new Set(museums.map(m => m.district))].forEach(d => {
            const opt = document.createElement("option");
            opt.value = d;
            opt.innerText = d;
            districtSelect.appendChild(opt);
        });

        // ====== Render Museums ======
        function renderMuseums() {
            const container = document.getElementById("museums");
            container.innerHTML = "";
            const search = document.getElementById("search").value.toLowerCase();
            const district = districtSelect.value;
            museums.forEach(m => {
                if (m.name.toLowerCase().includes(search) && (district === "all" || m.district === district)) {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${m.img}">
                            <h3>${m.name}</h3>
                            <p><b>${m.district}</b></p>
                            <p>${m.desc}</p>
                            <button onclick="window.open('${m.video}')">🎥 Video</button>
                            <button onclick="viewLocation('${m.name}', ${m.lat}, ${m.lng}, '${m.img}')">📍 Map</button>
                            <button onclick="bookTicket('${m.name}')">🎟️ Book Ticket</button>
                            <button onclick='viewArtifacts("${m.name}")'>🖼️ Artifacts</button>
                        </div>
                    `;
                }
            });
        }

        renderMuseums();

        // ====== Ticket Booking (FIXED FOR FLASK) ======
        function bookTicket(name) {
            window.location.href = "/ticket?museum=" + encodeURIComponent(name);
        }

        // ====== Artifacts ======
        function viewArtifacts(name) {
            window.location.href = "/artifact?museum=" + encodeURIComponent(name);
        }

        // ====== Map ======
        function viewLocation(name, lat, lng, img) {
            window.location.href = "/map?name=" + encodeURIComponent(name) + "&lat=" + lat + "&lng=" + lng + "&img=" + encodeURIComponent(img);
        }

        // ====== Back to Admin Dashboard ======
        function goBack() {
            window.location.href = "/admin";
        }
    </script>
</body>
</html>

    <script>
    // Hide logout buttons on small screens
    (function(){
        const sel = '.logout, .logout-btn, .nav-btn.logout, .nav-btn.logout-btn';
        function update(){
            const hide = window.innerWidth <= 480;
            document.querySelectorAll(sel).forEach(el=> el.style.display = hide ? 'none' : '');
        }
        update();
        window.addEventListener('resize', update);
    })();
    </script>

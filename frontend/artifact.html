<style>
body{font-family:Arial;background:#3a3a50;margin:0;text-align:center;}
header{background:#2a2a3e;color:lavender;padding:15px;font-size:22px;}
#artifacts{display:flex;flex-wrap:wrap;justify-content:center;margin:20px;}
.card{
 background:#4a4a60;
 width:260px;
 margin:10px;
 padding:12px;
 border-radius:10px;
 box-shadow:0 0 10px rgba(177,157,217,0.5);
}
.card img{
 width:100%;
 height:200px;
 object-fit:cover;
 border-radius:8px;
 margin-bottom:10px;
}
.card h3{margin:5px 0;color:lavender;}
.card p{margin:3px;color:#d4c5e2;font-size:14px;}
button{
 padding:10px 16px;
 border:none;
 background:#5a4a80;
 color:lavender;
 border-radius:6px;
 cursor:pointer;
 margin-bottom:20px;
 font-weight:bold;
}
button:hover{
 background:#7a6aaa;
}

/* 📱 Mobile responsive design */
@media (max-width: 768px) {
    header { font-size: 18px; padding: 10px; }
    #artifacts { margin: 10px; }
    .card { width: calc(50% - 10px); margin: 5px; padding: 10px; }
    .card img { height: 150px; }
    .card h3 { font-size: 14px; }
    button { padding: 8px 12px; font-size: 12px; }
}

@media (max-width: 480px) {
    body { margin: 0; padding: 0; }
    header { font-size: 16px; padding: 8px; }
    #artifacts { margin: 8px; }
    .card { width: 100%; margin: 6px 0; padding: 8px; }
    .card img { height: 120px; }
    .card h3 { font-size: 12px; margin: 3px 0; }
    .card p { font-size: 11px; }
    button { padding: 6px 10px; font-size: 11px; }
}
</style>
